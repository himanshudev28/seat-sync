<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeatSync — Book Events You'll Love</title>
    <meta name="description" content="SeatSync is the modern event booking platform. Browse, discover, and book tickets for the best live experiences near you." />
    <meta name="author" content="SeatSync" />
    <meta name="theme-color" content="#0F1419" />

    <meta property="og:title" content="SeatSync — Book Events You'll Love" />
    <meta property="og:description" content="Browse and book tickets for the best live experiences." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/placeholder.svg" />

    <!-- Preconnect to the image CDN event artwork comes from. Fonts are self-hosted and
         preloaded at build time (vite.config.ts → preloadFonts). -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

  </head>

  <body>
    <!-- The inline script sets the theme before first paint (no white flash in dark mode) and drops
         the hero shell on other routes. Its sha256 is allowed in vercel.json's CSP: update both together. -->
    <div id="root"><!--
      Static first paint of the home page hero, shown while the app's JavaScript loads (it used to
      be a blank page until then). It mirrors HeroSection's copy column class-for-class, so when
      React replaces it nothing moves. Removed below for every route other than "/".
      If you change the hero's copy or layout, change this too.
    --><div id="boot-shell" class="flex min-h-screen flex-col"><main class="flex-1 pt-20"><section class="relative isolate -mt-20 overflow-hidden pt-20"><div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10"><div class="lp-hero-glow absolute inset-0"></div><div class="lp-dots absolute inset-0"></div><div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-background to-transparent"></div></div><div class="container mx-auto max-w-7xl px-4"><div class="grid items-center gap-y-4 pb-24 pt-8 lg:min-h-[calc(100svh-5rem)] lg:grid-cols-12 lg:gap-x-4 lg:pb-28 lg:pt-4"><div class="relative z-20 flex flex-col gap-7 lg:col-span-5"><div class="flex min-h-[2.25rem] items-center"></div><h1 class="lp-hero-title font-display uppercase text-foreground"><span class="lp-line"><span>The <span class="text-primary">best seat</span></span></span><span class="lp-line"><span>in the house</span></span><span class="lp-line"><span>is yours.</span></span></h1><p class="lp-in max-w-md text-pretty text-lg leading-relaxed text-muted-foreground">Concerts, matches, theatre and more. See the live seat map, tap the exact seat you want, and your ticket lands in seconds.</p><div class="lp-in flex flex-col gap-3 sm:flex-row"><a href="/events" class="group inline-flex h-14 items-center justify-center gap-3 rounded-full bg-primary pl-7 pr-2 text-base font-semibold text-primary-foreground shadow-[0_14px_40px_-12px_hsl(var(--primary)/0.65)] transition-[transform,box-shadow] duration-300 hover:-translate-y-0.5 hover:shadow-[0_20px_50px_-12px_hsl(var(--primary)/0.75)] active:translate-y-0 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background motion-reduce:transform-none">Browse events<span class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-foreground/15 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-rotate-45 motion-reduce:transform-none"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span></a><a href="/auth" class="inline-flex h-14 items-center justify-center rounded-full border border-border bg-card/70 px-7 text-base font-semibold text-foreground backdrop-blur-sm transition-colors duration-200 hover:border-foreground/30 hover:bg-card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background">Create free account</a></div><ul class="lp-in flex flex-wrap items-center gap-x-6 gap-y-2 pt-1 text-sm text-muted-foreground"><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4 text-primary"><path d="M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3"></path><path d="M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z"></path><path d="M5 18v2"></path><path d="M19 18v2"></path></svg>Live seat maps</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4 text-primary"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>Instant confirmation</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4 text-primary"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>Secure checkout</li></ul></div></div></div></section><div aria-hidden="true" class="h-screen"></div></main></div></div>
    <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("theme");var dark=t==="dark"||((!t||t==="system")&&matchMedia("(prefers-color-scheme: dark)").matches);if(dark)d.classList.add("dark");d.style.colorScheme=dark?"dark":"light"}catch(e){}if(location.pathname!=="/"){var s=document.getElementById("boot-shell");if(s)s.remove()}})();</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
